mavlink:
  # SITL exposes SERIAL1 on TCP 5762; on the real drone this was the Pi on TELEM2.
  connection: tcp:127.0.0.1:5762
  heartbeat_timeout_s: 30

mission:
  # MISSION_ITEM_REACHED seq that starts detection.
  # seq 0 = home, seq 1 = TAKEOFF, seq 2 = first patrol waypoint.
  trigger_seq: 2
  # Patrol over the area for this long, then the companion sends RTL (as on the original drone:
  # "when the mission duration ends ... the Raspberry Pi sends an RTL").
  # Original flight time: 6200 mAh / 37.8 A = ~10 min. Takeoff, the flight out,
  # the return and landing take ~1.5 min; 6 min leaves ~25% in reserve.
  # The Pixhawk's own low-battery failsafe stays the last line of defence.
  patrol_time_s: 360

camera:
  # Gazebo camera of the gimbal; the world name is part of the topic.
  gazebo_topic: /world/security_patrol/model/iris_with_gimbal/model/gimbal/link/pitch_link/sensor/camera/image

detection:
  # YOLO26n with five classes: person, motor, bicycle, vehicle, dog (README,
  # "Real images from above"). Not in git and not published; see the README.
  # Best on the hand-labelled street video; on real clutter (rubbish, bags) it
  # raises more false boxes than the older person-only model.
  model: yolo26n_multiclass_ext.pt
  # 0.4: 0.25 raised false boxes on the same video from 14 to 100.
  confidence: 0.4
  classes: [0]               # only people raise the alarm
  # Measured on the WP2 Gazebo frame (person ~45 px, seen from above):
  # 640 found nothing at 0.4, 1280 found the person at 0.80. A larger
  # network input gives the small target more feature-map cells.
  image_size: 1280
  device: null               # null = GPU if available, else CPU
  # Original enhancement for the low-light NoIR camera. Off in simulation:
  # on clean renders it made YOLO box the person's shadow as well.
  equalize: false            # histogram equalisation on Y
  sharpen: false             # sharpening kernel
  snapshot_dir: logs/snapshots # first annotated detection is saved here (not in git)

tracking:
  # A box counts only once its track is seen in min_hits frames within window_s;
  # a confirmed track that loses its box stays for hold_s. max_px: match radius.
  enabled: true
  min_hits: 3
  window_s: 1.0
  hold_s: 0.5
  max_px: 60

alert:
  clear_after_s: 3           # alarm off after nobody is seen for this long
  notify_every_s: 10         # repeat STATUSTEXT while the threat stays
